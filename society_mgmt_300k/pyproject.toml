[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "society_mgmt"
version = "0.1.0"
description = "Society Management: a single canonical compute(x) migrated from JavaScript to Python, preserving the nine-layer taxonomy."
requires-python = ">=3.13"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
